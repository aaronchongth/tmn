[package]
name = "tmn"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[lints.clippy]
all = "deny"
unwrap_used = "deny"

[dependencies]
clap = { version = "4.6", features = ["derive", "wrap_help"] }
ratatui = "0.30"
crossterm = "0.29"
ansi-to-tui = "8.0"
nix = { version = "0.31", features = ["process", "signal", "term", "fs"] }
regex = "1.13"
signal-hook = "0.3"
